name: Daily Backup

on:
  schedule:
    # 21:00 UTC daily = 02:00 AM PKT (Asia/Karachi, UTC+5, no DST) — comfortably
    # after the Karachi business day has ended and after that day's transactions
    # are posted, so both the Excel/JSON snapshot and the app's own Daily
    # Snapshot (Phase 15, generated at 00:10 UTC ≈ 05:10 AM PKT) agree on which
    # calendar day's data this covers.
    - cron: "0 21 * * *"
  workflow_dispatch: {} # manual "run now" button in the Actions tab

jobs:
  backup:
    runs-on: ubuntu-latest
    # GitHub's default is 6 hours. A backup of this size takes under a minute,
    # so anything past this is something stuck -- most likely the Gmail SMTP
    # send, which nodemailer will wait on indefinitely rather than erroring.
    # Without this cap a single hang burns hours of Actions minutes AND delays
    # the failure alert by the same amount.
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backup
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 22, not 20: @supabase/supabase-js now warns that Node 20 and below
          # are deprecated, and GitHub is retiring Node 20 on its runners. 22 is
          # the current LTS, so this stops being a warning that turns into a
          # broken backup later.
          node-version: "22"
          cache: "npm"
          cache-dependency-path: backup/package-lock.json

      - run: npm ci

      - name: Run backup
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          BACKUP_EMAIL: ${{ secrets.BACKUP_EMAIL }}
          BACKUP_PASSWORD: ${{ secrets.BACKUP_PASSWORD }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          BACKUP_TO_EMAIL: ${{ secrets.BACKUP_TO_EMAIL }}
        run: node backup.js

      # A failed backup used to be completely silent — the only sign was the
      # success email not arriving, which is easy to miss. It was missed: four
      # runs failed between 12 and 15 September 2026 and went unnoticed.
      - name: Email an alert if the backup failed
        if: failure()
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          BACKUP_TO_EMAIL: ${{ secrets.BACKUP_TO_EMAIL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node notify-failure.js
